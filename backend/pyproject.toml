[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "langchain>=1.3.13",
    "langchain-core>=1.4.9",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    "pydantic>=2.13.4",
    "pyjwt>=2.8.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "uvicorn>=0.51.0",
    "pypdf>=5.0.0",
    "alembic>=1.13.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[dependency-groups]
dev = [
    "alembic>=1.13.2",
    "pyright>=1.1.411",
    "ruff>=0.16.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["."]

[tool.ruff]
exclude = [
    "**/.venv/**",
    ".venv/**",
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]
extend-exclude = ["**/.venv/**", ".venv/**", ".venv"]
src = ["app"]

